exp_name: "exp015_crop_test_yolo"

sweep:
  data.split_version: [seed_40_fold_0, seed_40_fold_1, seed_40_fold_2, seed_40_fold_3, seed_40_fold_4]

output_dir: "./results/exp015_ablation"

data:
  batch_size: 32
  padding_mode: "constant"
  image_id_map_mode: cropped
  use_oversampling: false
  split_version: v1

  label_mapping:
    "正常，冰敷即可": "觀察與冰敷組"
    "低風險，加強冰敷": "觀察與冰敷組"
    "無法辨識": "觀察與冰敷組"
    "中度風險，觀察3天": "異常需醫療介入"
    "高風險，立即就醫": "異常需醫療介入"

  features:
    numerical: ["BMI", "術後天數", "傷口大小"]
    categorical: 

  labels:
    num_classes: 2
    names: ["觀察與冰敷組", "異常需醫療介入"]

model:
  name: "DINOv2FusionClassifier"
  type: "multimodal"
  params:
    backbone_name: "assets/dinov2-small-local"
    num_classes: 2
    
    # Tabular
    tabular_dim: 3
    tabular_hidden_dim: 32

    # MLP Head
    mlp_dim: 256
    
    # LoRA settings
    use_lora: true
    lora_cfg:
      r: 64
      alpha: 128
      dropout: 0.1
      target_modules: ["query", "key", "value", "dense"] 
    
mixup:
  enable: true
  type: "mixup"
  alpha: 0.4
  prob: 0.5
  num_classes: 2

loss:
  name: "CrossEntropyLoss"
  params:
    use_weight: true

stages:
  - name: "stage1_linear_probe"
    epochs: 10
    freeze: ["backbone", "lora"]
    unfreeze: ["classifier"]
    optimizer:
      name: "AdamW"
      params:
        lr: 1.5e-3
        weight_decay: 0.01
    scheduler:
      name: "CosineAnnealingLR"
      params:
        T_max: 10
        eta_min: 1.0e-5

  - name: "stage2_finetune"
    epochs: 75
    freeze: ["backbone"]
    unfreeze: ["lora", "classifier"]
    override_lr: 4.2e-4
    scheduler:
      name: "CosineAnnealingLR"
      params:
        T_max: 75
        eta_min: 1.0e-7